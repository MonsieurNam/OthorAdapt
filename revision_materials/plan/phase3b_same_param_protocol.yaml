{
  "schema_version": "phase3b.same_param.v1",
  "status": "FROZEN_LEGACY_SAME_PARAMETER_CHECK",
  "rationale": "Phase 3B directly tests the strongest legacy claim under a transparent paired protocol: CLIP-LoRA r=2 versus OrthoAdapt/OH-SingLoRA H=2,r=2 at the same 184,320 trainable-parameter budget. This is a diagnostic same-parameter check and does not replace the validation-selected Phase 3 main matrix.",
