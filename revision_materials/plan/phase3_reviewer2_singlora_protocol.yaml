{
  "schema_version": "phase3.reviewer2.singlora.v1",
  "status": "FROZEN_FOR_REVIEWER2_REPLICATION",
  "rationale": "Three-seed SingLoRA r=8 replication requested by Reviewer 2 under the frozen Phase 3 training protocol.",
  "datasets": [
    "fgvc",
    "eurosat",
    "food101",
    "oxford_pets",
    "oxford_flowers",
    "caltech101",
    "dtd",
    "ucf101"
  ],
  "shots": [1, 4, 16],
  "seeds": [1, 2, 3],
  "method": {
    "adapter": "singlora",
    "r": 8,
    "alpha": 1,
    "ramp_up_steps": 100
  },
  "base_command": {
    "python": "$PYTHON",
    "entrypoint": "main.py",
    "root_path": "${DATA_ROOT}",
    "save_path": "revision_materials/checkpoints/phase3_reviewer2_singlora_ramp100",
    "train_manifest": "revision_materials/results/phase3_reviewer2_singlora_train_results.jsonl",
    "eval_manifest": "revision_materials/results/phase3_reviewer2_singlora_eval_results.jsonl",
    "train_log_dir": "revision_materials/logs/phase3_reviewer2_singlora_train",
    "eval_log_dir": "revision_materials/logs/phase3_reviewer2_singlora_eval",
    "backbone": "ViT-B/16",
    "encoder": "both",
    "position": "all",
    "params": ["q", "k", "v"],
    "n_iters": 500,
    "batch_size": 32,
    "loss_fn": "ce",
    "ortho_reduction": "mean"
  },
  "expected_train_command_count": 72,
  "expected_eval_command_count": 72
}
